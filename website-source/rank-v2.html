<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rank - Raj Mock Test V2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Poppins", sans-serif;
    background: #f5f7fb;
    color: #1f2937;
    min-height: 100vh;
}

.topbar {
    background: white;
    padding: 16px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    position: sticky;
    top: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-logo {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background: #eef2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand h2 {
    font-size: 19px;
    font-weight: 700;
}

.brand span {
    font-size: 11px;
    color: #6366f1;
    font-weight: 600;
}

.back-btn {
    border: none;
    background: #eef2ff;
    color: #4f46e5;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: 25px auto 50px;
}

.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

.page-title p {
    color: #6b7280;
    font-size: 14px;
}

.my-rank {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 25px;
    box-shadow: 0 10px 25px rgba(99,102,241,.22);
}

.my-rank small {
    opacity: .85;
}

.my-rank-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
}

.rank-number {
    font-size: 38px;
    font-weight: 700;
}

.rank-percent {
    text-align: right;
}

.rank-percent strong {
    font-size: 24px;
}

.rank-percent small {
    display: block;
}

.leaderboard {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.leaderboard h2 {
    font-size: 19px;
    margin-bottom: 15px;
}

.rank-row {
    display: grid;
    grid-template-columns: 55px 1fr 110px 90px;
    align-items: center;
    gap: 10px;
    padding: 15px 10px;
    border-bottom: 1px solid #eef0f4;
}

.rank-row:last-child {
    border-bottom: none;
}

.rank-row.me {
    background: #eef2ff;
    border-radius: 12px;
}

.position {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
}

.student-name {
    font-weight: 600;
}

.student-tests {
    color: #6b7280;
    font-size: 12px;
}

.percentage {
    text-align: right;
    font-weight: 700;
    color: #4f46e5;
}

.loading,
.empty,
.error {
    text-align: center;
    padding: 45px 20px;
    color: #6b7280;
}

.loader {
    width: 35px;
    height: 35px;
    border: 4px solid #e5e7eb;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.retry-btn {
    margin-top: 12px;
    border: none;
    background: #6366f1;
    color: white;
    padding: 10px 18px;
    border-radius: 9px;
    cursor: pointer;
}

@media (max-width: 600px) {

    .topbar {
        padding: 14px 4%;
    }

    .brand h2 {
        font-size: 16px;
    }

    .container {
        width: 94%;
    }

    .page-title h1 {
        font-size: 24px;
    }

    .rank-row {
        grid-template-columns: 45px 1fr 75px;
    }

    .rank-row .student-tests {
        display: none;
    }

    .percentage {
        font-size: 13px;
    }

}

</style>

    <link rel="stylesheet" href="css/raj-mock-v2-theme.css">
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-logo">
            🏆
        </div>

        <div>
            <h2>RAJ MOCK</h2>
            <span>TEST V2.0</span>
        </div>

    </div>

    <button
        class="back-btn"
        id="backBtn"
        type="button">

        ← Dashboard

    </button>

</header>


<main class="container">

    <section class="page-title">

        <h1>
            🏆 Leaderboard
        </h1>

        <p>
            See your performance compared with other students.
        </p>

    </section>


    <section
        class="my-rank"
        id="myRankBox">

        <small>
            YOUR CURRENT RANK
        </small>

        <div class="my-rank-content">

            <div>

                <div
                    class="rank-number"
                    id="myRank">
                    --
                </div>

            </div>

            <div class="rank-percent">

                <strong id="myPercentage">
                    0%
                </strong>

                <small>
                    Average Percentage
                </small>

            </div>

        </div>

    </section>


    <section class="leaderboard">

        <h2>
            Top Students
        </h2>

        <div id="rankList">

            <div class="loading">

                <div class="loader"></div>

                Loading ranking...

            </div>

        </div>

    </section>

</main>


<script
    type="module"
    src="js/rank-v2.js">
</script>

</body>

</html>
