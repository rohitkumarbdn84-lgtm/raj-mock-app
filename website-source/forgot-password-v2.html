<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Raj Mock Test V2.0</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
    linear-gradient(
        rgba(11,44,102,.78),
        rgba(21,101,192,.78)
    ),
    url("images/background.jpg");

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

}

.card{

    width:420px;

    max-width:100%;

    background:rgba(255,255,255,.97);

    padding:35px;

    border-radius:18px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);

}

.logo{

    text-align:center;

    margin-bottom:22px;

}

.logo img{

    width:80px;

    height:80px;

    object-fit:contain;

    margin-bottom:10px;

}

.logo h2{

    color:#0B2C66;

    margin-bottom:6px;

    font-size:25px;

}

.logo p{

    color:#666;

    font-size:14px;

}

.input-group{

    margin-top:18px;

}

.input-group label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#0B2C66;

    font-size:14px;

}

.input-group input{

    width:100%;

    height:50px;

    padding:0 14px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:15px;

    outline:none;

    transition:.2s;

}

.input-group input:focus{

    border-color:#1565C0;

    box-shadow:
        0 0 8px
        rgba(21,101,192,.2);

}

button{

    width:100%;

    margin-top:22px;

    height:50px;

    padding:0 14px;

    background:#0B2C66;

    color:#fff;

    border:none;

    border-radius:8px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

}

button:hover{

    background:#1565C0;

}

button:disabled{

    opacity:.65;

    cursor:not-allowed;

}

#passwordSection{

    display:none;

    margin-top:20px;

}

.password-box{

    position:relative;

    width:100%;

    margin-bottom:15px;

}

.password-box input{

    width:100%;

    height:50px;

    padding:0 50px 0 14px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:15px;

    outline:none;

}

.password-box input:focus{

    border-color:#1565C0;

    box-shadow:
        0 0 8px
        rgba(21,101,192,.2);

}

.password-box i{

    position:absolute;

    right:16px;

    top:50%;

    transform:translateY(-50%);

    color:#777;

    cursor:pointer;

    font-size:18px;

}

.password-box i:hover{

    color:#1565C0;

}

#message{

    display:none;

    margin-top:16px;

    padding:12px;

    border-radius:8px;

    font-size:13px;

    line-height:20px;

    text-align:center;

}

#message.show{

    display:block;

}

#message.error{

    background:#fff1f2;

    border:1px solid #fecdd3;

    color:#be123c;

}

#message.success{

    background:#ecfdf5;

    border:1px solid #a7f3d0;

    color:#047857;

}

.note{

    margin-top:18px;

    padding:13px;

    background:#eef5ff;

    border-left:5px solid #1565C0;

    border-radius:8px;

    color:#333;

    font-size:13px;

    line-height:21px;

}

.back{

    margin-top:20px;

    text-align:center;

}

.back a{

    text-decoration:none;

    font-weight:bold;

    color:#1565C0;

    font-size:14px;

}

.back a:hover{

    text-decoration:underline;

}

@media(max-width:500px){

    .card{

        padding:25px 20px;

    }

    .logo h2{

        font-size:22px;

    }

}

</style>

    <link rel="stylesheet" href="css/raj-mock-v2-theme.css">
</head>

<body>


<div class="card">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="images/logo.png"
            alt="Raj Mock Test"
        >

        <h2>
            Forgot Password
        </h2>

        <p>
            Verify your account and reset password
        </p>

    </div>


    <!-- MOBILE -->

    <div class="input-group">

        <label for="mobile">
            Mobile Number
        </label>

        <input
            type="text"
            id="mobile"
            placeholder="Enter 10 digit mobile number"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
        >

    </div>


    <!-- EMAIL -->

    <div class="input-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter registered email"
            autocomplete="email"
        >

    </div>


    <!-- VERIFY -->

    <button
        type="button"
        id="submitBtn"
    >

        <i class="fa-solid fa-circle-check"></i>

        Verify Account

    </button>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- PASSWORD SECTION -->

    <div
        id="passwordSection"
    >


        <!-- NEW PASSWORD -->

        <div class="password-box">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
            >

            <i
                class="fa-solid fa-eye"
                id="toggleNewPassword"
            ></i>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >

            <i
                class="fa-solid fa-eye"
                id="toggleConfirmPassword"
            ></i>

        </div>


        <!-- RESET -->

        <button
            type="button"
            id="resetBtn"
        >

            <i class="fa-solid fa-key"></i>

            Reset Password

        </button>


    </div>


    <!-- NOTE -->

    <div class="note">

        <b>Note:</b><br>

        Enter your registered mobile number and email.
        After successful verification, you can create a new password.

    </div>


    <!-- BACK -->

    <div class="back">

        <a href="student-login-v2.html">

            ← Back to Login

        </a>

    </div>


</div>


<!-- PASSWORD TOGGLE -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        function togglePassword(
            inputId,
            iconId
        ){

            const input =
                document.getElementById(inputId);

            const icon =
                document.getElementById(iconId);

            if(!input || !icon){
                return;
            }

            icon.addEventListener(
                "click",
                function(){

                    if(
                        input.type === "password"
                    ){

                        input.type = "text";

                        icon.classList.remove(
                            "fa-eye"
                        );

                        icon.classList.add(
                            "fa-eye-slash"
                        );

                    }
                    else{

                        input.type = "password";

                        icon.classList.remove(
                            "fa-eye-slash"
                        );

                        icon.classList.add(
                            "fa-eye"
                        );

                    }

                }
            );

        }


        togglePassword(
            "newPassword",
            "toggleNewPassword"
        );


        togglePassword(
            "confirmPassword",
            "toggleConfirmPassword"
        );

    }
);




</script>


<!-- FORGOT PASSWORD JS -->

<script
    type="module"
    src="./js/forgot-password-v2.js"
></script>


</body>

</html>
