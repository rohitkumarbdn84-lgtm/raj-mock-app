<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Profile - Raj Mock Test V2.0</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Poppins", sans-serif;
    background: #f5f7fb;
    color: #1f2937;
    min-height: 100vh;
}

.topbar {
    background: white;
    padding: 16px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-logo {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background: #eef2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand h2 {
    font-size: 19px;
}

.brand span {
    font-size: 11px;
    color: #6366f1;
    font-weight: 600;
}

.back-btn {
    border: none;
    background: #eef2ff;
    color: #4f46e5;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: 25px auto 50px;
}

.profile-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
    margin-bottom: 22px;
}

.avatar {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
    );
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
}

.profile-card h1 {
    margin-top: 15px;
    font-size: 25px;
}

.profile-card p {
    color: #6b7280;
    font-size: 14px;
    margin-top: 4px;
}

.info-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.info-card h2 {
    font-size: 18px;
    margin-bottom: 15px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eef0f4;
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    color: #6b7280;
}

.info-value {
    font-weight: 600;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.stat-icon {
    font-size: 27px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 7px;
    color: #4f46e5;
}

.stat-label {
    color: #6b7280;
    font-size: 12px;
    margin-top: 3px;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.loader {
    width: 32px;
    height: 32px;
    border: 4px solid #e5e7eb;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto auto 10px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 600px) {

    .container {
        width: 94%;
    }

    .profile-card {
        padding: 25px 18px;
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .brand h2 {
        font-size: 16px;
    }

}

</style>

    <link rel="stylesheet" href="css/raj-mock-v2-theme.css">
</head>

<body>


<header class="topbar">

    <div class="brand">

        <div class="brand-logo">
            👤
        </div>

        <div>

            <h2>RAJ MOCK</h2>

            <span>
                TEST V2.0
            </span>

        </div>

    </div>


    <button
        class="back-btn"
        id="backBtn"
        type="button">

        ← Dashboard

    </button>

</header>


<main class="container">


    <!-- PROFILE -->

    <section class="profile-card">

        <div
            class="avatar"
            id="profileAvatar">

            R

        </div>


        <h1 id="studentName">
            Student
        </h1>


        <p>
            Raj Mock Test Student
        </p>

    </section>


    <!-- BASIC INFORMATION -->

    <section class="info-card">

        <h2>
            👤 Personal Information
        </h2>


        <div class="info-row">

            <span class="info-label">
                Student Name
            </span>

            <span
                class="info-value"
                id="profileName">

                --

            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                Mobile Number
            </span>

            <span
                class="info-value"
                id="profileMobile">

                --

            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                Student ID
            </span>

            <span
                class="info-value"
                id="profileId">

                --

            </span>

        </div>

    </section>


    <!-- STATISTICS -->

    <section class="info-card">

        <h2>
            📊 Performance
        </h2>


        <div
            class="stats-grid"
            id="statsGrid">

            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <div
                    class="stat-value"
                    id="testsAttempted">
                    0
                </div>

                <div class="stat-label">
                    Tests Attempted
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📈
                </div>

                <div
                    class="stat-value"
                    id="averagePercentage">
                    0%
                </div>

                <div class="stat-label">
                    Average %
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🎯
                </div>

                <div
                    class="stat-value"
                    id="bestScore">
                    0
                </div>

                <div class="stat-label">
                    Best Score
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✅
                </div>

                <div
                    class="stat-value"
                    id="correctAnswers">
                    0
                </div>

                <div class="stat-label">
                    Correct Answers
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📚
                </div>

                <div
                    class="stat-value"
                    id="totalQuestions">
                    0
                </div>

                <div class="stat-label">
                    Questions Attempted
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    🎯
                </div>

                <div
                    class="stat-value"
                    id="accuracy">
                    0%
                </div>

                <div class="stat-label">
                    Accuracy
                </div>

            </div>

        </div>

    </section>

</main>


<script
    type="module"
    src="js/profile-v2.js">
</script>

</body>

</html>
